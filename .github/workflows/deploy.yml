name: CI

on:
  push:
    branches: [main]
  # A PR roda so o job `test` (lint, tipos, os dois portoes de cobertura e a
  # suite do MCP). O `build` fica de fora: ele empurra
  # `:latest` para o GHCR, e o servidor publicaria a PR antes do merge.
  pull_request:
    branches: [main]
  workflow_dispatch:

# Push na main continua serializado; PR tem grupo proprio e nao espera deploy.
concurrency:
  group: deploy-${{ github.repository }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # A suite roda antes do build: imagem quebrada nao chega no GHCR.
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar dependencias
        run: pip install -r agent/requirements-dev.txt
      - name: Lint e tipos
        working-directory: agent
        run: |
          ruff check src tests ../erp/app ../mcpsrv
          ruff format --check src tests ../erp/app ../mcpsrv
          mypy --strict src/policy src/tools
      - name: Testes
        working-directory: agent
        run: python -m pytest tests/ -q
      - name: Portao de cobertura — policy exige 100%
        working-directory: agent
        run: python -m pytest tests/test_policy.py -q --cov=src/policy --cov-report=term-missing --cov-fail-under=100
      - name: Portao de cobertura — tools/ exige 90%
        working-directory: agent
        run: python -m pytest tests/ -q --cov=src/tools --cov-report=term-missing --cov-fail-under=90

      # O servidor MCP tem conjunto de dependencias PROPRIO (o SDK arrasta
      # starlette novo, incompativel com o fastapi do agente). Instalar num venv
      # separado e o que garante que a suite dele roda sob a mesma resolucao que
      # a imagem dele vai ter — testar sob as deps do agente nao provaria nada.
      # `tests/test_imagem.py` monta so os arquivos que os COPY do Dockerfile
      # levam e importa o servidor ali: import que sai da imagem quebra aqui,
      # e nao em producao (foi o que derrubou o MCP no #8).
      - name: Testes do servidor MCP (venv proprio, imagem montada pelos COPY)
        run: |
          python -m venv /tmp/mcpvenv
          /tmp/mcpvenv/bin/pip install -q -r mcpsrv/requirements.txt pytest==8.3.4 pytest-asyncio==0.25.0
          cd mcpsrv && /tmp/mcpvenv/bin/python -m pytest tests -q

  build:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Placeholder de .env (o env_file do compose e lido no build)
        run: touch .env
      - name: Build + push (dirigido pelo compose)
        run: |
          docker compose build
          docker compose push

# Sem job de deploy por SSH de proposito: o servidor puxa sozinho, sincroniza o
# repo e recria o container quando o digest da imagem muda.
# Os dois rodando juntos disputavam o mesmo container e o docker respondia
# "removal already in progress", deixando o CI vermelho num deploy que deu certo.
