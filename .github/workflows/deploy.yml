name: Build & push image (VPS auto-pulls)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.repository }}
  cancel-in-progress: false

jobs:
  # A suite roda antes do build: imagem quebrada nao chega no GHCR.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar dependencias
        run: pip install -r agent/requirements-dev.txt
      - name: Lint e tipos (convencao da fabrica)
        working-directory: agent
        run: |
          ruff check src tests ../erp/app
          ruff format --check src tests ../erp/app
          mypy --strict src/policy src/tools
      - name: Testes
        working-directory: agent
        run: python -m pytest tests/ -q
      - name: Portao do passo 3 — policy exige 100%
        working-directory: agent
        run: python -m pytest tests/test_policy.py -q --cov=src/policy --cov-report=term-missing --cov-fail-under=100
      - name: Portao do checklist — tools/ exige 90%
        working-directory: agent
        run: python -m pytest tests/ -q --cov=src/tools --cov-report=term-missing --cov-fail-under=90

  build:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Placeholder de .env (o env_file do compose e lido no build)
        run: touch .env
      - name: Build + push (dirigido pelo compose)
        run: |
          docker compose build
          docker compose push

# Sem job de deploy por SSH de proposito: a VPS puxa sozinha pelo timer
# `ghcr-autopull@opt-showcase-clinica-aurora.timer`, que roda a cada 3 minutos,
# sincroniza o repo e recria o container quando o digest da imagem muda.
# Os dois rodando juntos disputavam o mesmo container e o docker respondia
# "removal already in progress", deixando o CI vermelho num deploy que deu certo.
# Este e o mesmo padrao build-only dos outros nove projetos migrados.
