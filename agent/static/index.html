<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clínica Aurora: um agente que grava numa agenda de verdade</title>
<meta name="description" content="Demo ao vivo: um agente de IA que grava numa agenda de verdade, pede confirmação antes de alterar e recusa quando a regra da clínica não permite. O ERP em que ele grava é publicado ao lado.">
<meta name="author" content="Gomio">

<!-- Sem estas tags o link vira URL crua no LinkedIn, no WhatsApp e no Upwork —
     que é justamente onde ele é compartilhado. og:image precisa ser absoluta. -->

<meta property="og:url" content="https://aurora.pgdev.com.br/">
<meta property="og:site_name" content="Gomio">
<meta property="og:locale" content="pt_BR">
<meta property="og:locale:alternate" content="en_US">
<meta property="og:title" content="Um agente que grava na agenda, e recusa quando a regra não deixa">
<meta property="og:description" content="Demo aberta, sem cadastro: converse com o agente e veja a linha mudar no ERP ao vivo. Ele pede confirmação antes de gravar. Dados sintéticos.">
<meta property="og:image" content="https://aurora.pgdev.com.br/static/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Clínica Aurora: demo ao vivo de um agente que grava numa agenda de verdade.">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Um agente que grava na agenda, e recusa quando a regra não deixa">
<meta name="twitter:description" content="Demo ao vivo: converse com o agente e veja a linha mudar no ERP.">
<meta name="twitter:image" content="https://aurora.pgdev.com.br/static/og.png">

<!-- Inline: uma aba sem ícone parece página abandonada, e um /favicon.ico
     404ando era uma requisição perdida em toda visita. -->
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%2360a5fa'/><rect x='11.5' y='11.5' width='9' height='9' rx='2' fill='%230a0a0a' transform='rotate(45 16 16)'/></svg>">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg:#0a0a0a; --painel:rgba(255,255,255,.045); --linha:rgba(255,255,255,.09);
    --txt:#fff; --txt2:rgba(255,255,255,.58); --txt3:rgba(255,255,255,.38);
    --azul:#60a5fa; --ok:#4ade80; --nao:#fbbf24; --erro:#f87171;
    --mono:'JetBrains Mono',ui-monospace,monospace;
  }
  body{
    font-family:Inter,ui-sans-serif,system-ui,-apple-system,sans-serif;
    background:var(--bg);color:var(--txt);min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  a{color:var(--azul)}
  .topo{
    display:flex;align-items:center;justify-content:space-between;gap:1rem;
    padding:.85rem 1.25rem;border-bottom:1px solid var(--linha);
    background:rgba(255,255,255,.03);backdrop-filter:blur(12px);
    position:sticky;top:0;z-index:10;flex-wrap:wrap;
  }
  .marca{display:flex;align-items:center;gap:.6rem;font-weight:600;letter-spacing:-.02em}
  .marca span.dot{width:22px;height:22px;border-radius:6px;background:linear-gradient(135deg,#60a5fa,#7dd3fc);display:grid;place-items:center}
  .marca span.dot i{width:7px;height:7px;border-radius:2px;background:#0a0a0a;transform:rotate(45deg);display:block}
  .por{font-weight:400;font-size:12px;color:var(--txt3);letter-spacing:0;padding-left:.6rem;border-left:1px solid var(--linha)}
  .por a{color:var(--txt2);text-decoration:none;border-bottom:1px solid rgba(255,255,255,.22)}
  .por a:hover{color:var(--txt);border-bottom-color:var(--azul)}
  @media (max-width:560px){.por{padding-left:0;border-left:0;flex-basis:100%}}
  .aviso{font-size:12px;color:var(--txt3);max-width:52ch;line-height:1.5}
  .acoes{display:flex;gap:.5rem;flex-wrap:wrap}
  button{font:inherit;cursor:pointer;border:1px solid var(--linha);background:var(--painel);color:var(--txt);
    border-radius:999px;padding:.45rem .9rem;font-size:12.5px;transition:.2s}
  button:hover:not(:disabled){background:rgba(255,255,255,.09)}
  button:disabled{opacity:.45;cursor:not-allowed}
  button.perigo[aria-pressed="true"]{border-color:rgba(248,113,113,.55);background:rgba(248,113,113,.14);color:#fecaca}

  .tela{display:grid;grid-template-columns:1fr 1fr;gap:0;height:calc(100vh - 57px)}
  @media (max-width:940px){.tela{grid-template-columns:1fr;height:auto}}
  .col{display:flex;flex-direction:column;min-height:0}
  .col+.col{border-left:1px solid var(--linha)}
  @media (max-width:940px){.col+.col{border-left:0;border-top:1px solid var(--linha)}}
  .cabeca{padding:.7rem 1.1rem;border-bottom:1px solid var(--linha);font-size:11px;
    text-transform:uppercase;letter-spacing:.18em;color:var(--txt3);display:flex;justify-content:space-between;gap:1rem}

  .chat{flex:1;overflow-y:auto;padding:1.1rem;display:flex;flex-direction:column;gap:.7rem;min-height:340px}
  .bolha{max-width:82%;padding:.65rem .9rem;border-radius:14px;font-size:14px;line-height:1.55;white-space:pre-wrap}
  .eu{align-self:flex-end;background:rgba(96,165,250,.14);border:1px solid rgba(96,165,250,.28)}
  .ela{align-self:flex-start;background:var(--painel);border:1px solid var(--linha)}
  .sistema{align-self:center;font-size:12px;color:var(--txt3);text-align:center;max-width:90%}
  .pensando{align-self:flex-start;color:var(--txt3);font-size:13px}

  .sugestoes{display:flex;flex-wrap:wrap;gap:.4rem;padding:0 1.1rem .7rem}
  .sugestoes button{font-size:12px;padding:.35rem .7rem;display:flex;flex-direction:column;
    align-items:flex-start;gap:.15rem;text-align:left;line-height:1.25}
  /* O rótulo diz o que o botão PROVA; a mensagem em si fica secundária. Sem
     isso o visitante clica na recusa por política e pode ler como bot falhando. */
  .sugestoes .rotulo{font-size:9.5px;text-transform:uppercase;letter-spacing:.09em;
    color:var(--txt3);font-weight:600}
  /* O resultado esperado, em uma linha: é o que evita ler a recusa como falha. */
  .sugestoes .efeito{font-size:10.5px;color:var(--txt3);max-width:30ch}
  .sugestoes button{border-radius:12px}
  .barra input:disabled{opacity:.5}
  /* Versão da política ao lado do código da regra: é o que prova, meses
     depois, sob qual regra a decisão foi tomada. */
  .versao{font-size:10px;color:var(--txt3);margin-left:.35rem;white-space:nowrap}
  .provas{display:flex;flex-wrap:wrap;gap:.3rem .45rem;font-family:var(--mono);font-size:10.5px;
    margin:.55rem 0 0}
  .provas span{border:1px solid var(--linha);border-radius:5px;padding:.15rem .45rem;color:var(--txt2);
    background:rgba(255,255,255,.03)}
  .provas b{color:var(--txt);font-weight:500}
  .barra{display:flex;gap:.5rem;padding:.9rem 1.1rem;border-top:1px solid var(--linha)}
  .barra input{flex:1;background:rgba(255,255,255,.04);border:1px solid var(--linha);color:var(--txt);
    border-radius:10px;padding:.6rem .8rem;font:inherit;font-size:14px}
  .barra input:focus{outline:none;border-color:rgba(96,165,250,.7)}
  .barra button{background:linear-gradient(90deg,#60a5fa,#7dd3fc);color:#0a0a0a;font-weight:600;border:none}

  .direita{flex:1;overflow-y:auto;padding:1.1rem;display:flex;flex-direction:column;gap:1.1rem}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th{text-align:left;font-weight:500;color:var(--txt3);font-size:11px;text-transform:uppercase;
    letter-spacing:.1em;padding:.45rem .5rem;border-bottom:1px solid var(--linha)}
  td{padding:.55rem .5rem;border-bottom:1px solid rgba(255,255,255,.05);color:var(--txt2)}
  tr.cancelada td{opacity:.45;text-decoration:line-through}
  tr.mudou td{background:rgba(96,165,250,.14);color:#fff}
  @keyframes pisca{0%{background:rgba(96,165,250,.32)}100%{background:rgba(96,165,250,.14)}}
  tr.mudou td{animation:pisca 1.1s ease-out}

  .log{display:flex;flex-direction:column;gap:.4rem;font-family:var(--mono);font-size:12px}
  .ev{border:1px solid var(--linha);border-radius:9px;padding:.5rem .65rem;background:rgba(255,255,255,.025);
    display:flex;gap:.55rem;align-items:flex-start;line-height:1.5;word-break:break-word}
  .ev .tag{flex-shrink:0;font-size:10px;text-transform:uppercase;letter-spacing:.08em;padding:.1rem .4rem;
    border-radius:4px;background:rgba(255,255,255,.08);color:var(--txt2)}
  .ev.write .tag{background:rgba(74,222,128,.16);color:var(--ok)}
  .ev.negado .tag{background:rgba(251,191,36,.16);color:var(--nao)}
  .ev.erro .tag{background:rgba(248,113,113,.16);color:var(--erro)}
  .ev.permitido .tag{background:rgba(96,165,250,.16);color:var(--azul)}
  /* A linha de custo e a mais discreta do log de proposito: ela precisa estar
     em TODA chamada paga, e com o mesmo peso das outras viraria ruido que
     esconde a decisao de politica, que e o que o visitante veio ver. */
  .ev.medida{opacity:.72}
  .ev.medida .tag{background:rgba(255,255,255,.06);color:var(--txt3)}
  .ev.medida:hover{opacity:1}
  /* Cache que nao leu e o unico caso em que a linha de custo GRITA: e o sinal
     de invalidador silencioso, e foi assim que o bug do gate apareceu. */
  .ev.semcache{opacity:1}
  .ev.semcache .tag{background:rgba(251,191,36,.16);color:var(--nao)}
  .ev b{color:var(--txt);font-weight:500}
  .vazio{color:var(--txt3);font-size:12.5px;font-family:Inter,sans-serif}
  .rodape{padding:.8rem 1.1rem;border-top:1px solid var(--linha);font-size:11.5px;color:var(--txt3);line-height:1.6}
  .assinatura{margin-top:.55rem;padding-top:.55rem;border-top:1px solid rgba(255,255,255,.05);color:var(--txt2)}
  .assinatura a{color:var(--txt2);text-decoration:none;border-bottom:1px solid rgba(255,255,255,.22)}
  .assinatura a:hover{color:var(--txt);border-bottom-color:var(--azul)}
</style>
</head>
<body>

<header class="topo">
  <div class="marca">
    <span class="dot"><i></i></span>
    Clínica Aurora
    <!-- Quem se impressiona com a demo precisa de um caminho para quem a fez.
         Sem isto a página termina em si mesma. -->
    <span class="por"><span data-t="por">uma demo de</span> <a href="https://gomio.com.br" target="_blank" rel="noopener">Gomio</a></span>
  </div>
  <p class="aviso" data-t-html="aviso"></p>
  <!-- Barra de provas. Vazia por padrao e preenchida por /api/meta: os numeros
       sao GERADOS no CI, nunca digitados. Se o build nao rodou o gerador, ela
       continua invisivel — melhor nao afirmar do que afirmar errado. -->
  <div class="provas" id="provas" hidden></div>
  <div class="acoes">
    <button id="chaos" class="perigo" aria-pressed="false" data-t="chaos"></button>
    <button id="reset" data-t="reset"></button>
    <!-- A interface abre em português, que é o público da Gomio. A conversa
         continua acompanhando o idioma de quem escreve, em qualquer um deles. -->
    <button id="idioma" aria-label="Language / Idioma"></button>
  </div>
</header>

<main class="tela">
  <section class="col">
    <div class="cabeca"><span data-t="cabecaConversa"></span><span id="estado"></span></div>
    <div class="chat" id="chat"></div>
    <div class="sugestoes" id="sugestoes"></div>
    <form class="barra" id="form">
      <input id="entrada" autocomplete="off" maxlength="500">
      <button type="submit" id="enviar" data-t="enviar"></button>
    </form>
  </section>

  <section class="col">
    <!-- Dois indicadores, porque são duas coisas. O "online" antigo era só do
         ERP, e ficou verde durante a queda inteira do assistente. -->
    <div class="cabeca">
      <span data-t="cabecaAgenda"></span>
      <span><span data-t="rotuloErp"></span> <b id="erpstatus">…</b> · <span data-t="rotuloAgente"></span> <b id="agentestatus">…</b></span>
    </div>
    <div class="direita">
      <div>
        <table>
          <thead><tr><th data-t="colConsulta"></th><th data-t="colPaciente"></th><th data-t="colProfissional"></th><th data-t="colInicio"></th></tr></thead>
          <tbody id="agenda"><tr><td colspan="4" class="vazio" data-t="carregando"></td></tr></tbody>
        </table>
      </div>
      <div>
        <div class="cabeca" style="padding:0 0 .6rem;border:0;display:flex;justify-content:space-between;gap:.5rem">
          <span data-t="cabecaLog"></span>
          <!-- O que esta conversa custou de verdade, somando toda chamada paga.
               Fica ao lado do log porque e a mesma promessa: o que a demo
               afirma, ela mostra acontecendo. -->
          <span data-t-title="gastoTitulo"><span data-t="gastoRotulo"></span> <b id="gasto" style="color:rgba(255,255,255,.75)">$0.00</b></span>
        </div>
        <div class="log" id="log"></div>
      </div>
    </div>
    <div class="rodape">
      <span data-t-html="limites"></span>
      <div class="assinatura">
        <span data-t="feitoPor"></span> <a href="https://gomio.com.br" target="_blank" rel="noopener">Gomio</a> ·
        <a href="https://portfolio.pgdev.com.br" target="_blank" rel="noopener" data-t="outrosProjetos"></a>
      </div>
    </div>
  </section>
</main>

<script>
const $ = (s) => document.querySelector(s);
const chat = $("#chat"), log = $("#log"), agenda = $("#agenda");
let ultimoEstadoAgenda = new Map();
let encerrada = false;

// Textos da interface. Tudo que a TELA diz passa por aqui; o que o MODELO diz
// segue o idioma de quem escreve, em qualquer língua, e não depende disto.
const T = {
  pt: {
    htmlLang: "pt-BR", locale: "pt-BR",
    titulo: "Clínica Aurora: um agente que grava numa agenda de verdade",
    por: "uma demo de",
    aviso: 'Clínica <strong>fictícia</strong>, com dados sintéticos. A gravação acontece de verdade, por HTTP, num ERP separado que você pode inspecionar: <a href="https://aurora-erp.pgdev.com.br/docs" target="_blank" rel="noopener">documentação técnica da API</a> (em inglês).',
    chaos: "Derrubar o ERP", chaosLigado: "Religar o ERP",
    reset: "Reiniciar", idiomaBotao: "EN",
    cabecaConversa: "Conversa · recepção da clínica",
    enviar: "Enviar",
    placeholder: "remarque a consulta da Ana para as 16h",
    placeholderEncerrada: "Conversa encerrada. Clique em Reiniciar.",
    cabecaAgenda: "Agenda no ERP",
    rotuloErp: "ERP", rotuloAgente: "assistente",
    erpOnline: "no ar", erpDown: "fora do ar (503)", erpSemResposta: "sem resposta",
    agenteOk: "respondendo", agenteIndisponivel: "indisponível", agenteSemDados: "ainda sem uso",
    colConsulta: "Consulta", colPaciente: "Paciente", colProfissional: "Profissional", colInicio: "Início",
    carregando: "carregando…", semConsultas: "nenhuma consulta", vagaAberta: "vaga aberta",
    cabecaLog: "Log de decisões",
    gastoRotulo: "esta conversa:",
    gastoTitulo: "Quanto esta conversa custou até agora, pelas tarifas de pricing.yaml",
    logVazio: "Cada consulta à agenda, cada decisão de regra e cada gravação aparece aqui, com o código da regra que decidiu.",
    limites: '<strong style="color:rgba(255,255,255,.75)">Limites da demo</strong> · sessão anônima com agenda própria e isolada · no máximo 3 alterações por conversa · teto diário de gasto em dólares, reservado antes de cada chamada paga e conferido depois pelo uso real · botão de desligar geral · nada fica guardado depois da sessão.',
    feitoPor: "Feito pela", outrosProjetos: "outros projetos",
    saudacao: "Oi! Sou a assistente da recepção. Consulto a agenda, remarco, cancelo e abro vagas. Antes de qualquer alteração, eu digo o que vou fazer e espero você confirmar. Pode escrever em qualquer idioma: respondo no seu.",
    pensando: "pensando…",
    estados: {
      greeting: "início", qualifying: "entendendo o pedido", collecting: "reunindo detalhes",
      confirming: "esperando a sua confirmação", executing: "gravando", resolved: "concluído",
      escalated: "encerrada",
    },
    sugestoes: [
      { rotulo: "Só consultar", msg: "O que tem na agenda do Dr. Bruno?", efeito: "Lista as consultas. Nada muda na agenda." },
      { rotulo: "Remarcar com confirmação", msg: "Remarque a consulta da Ana para as 16h", efeito: "Propõe a mudança e espera o seu “sim”. Só grava depois." },
      { rotulo: "Regra da clínica", msg: "Cancele a consulta do João", efeito: "Faltam menos de 24 h: a regra exige o motivo antes de cancelar." },
      { rotulo: "Fora do expediente", msg: "Passe a consulta da Ana para domingo às 10h", efeito: "A regra de expediente recusa. Nada é gravado." },
      { rotulo: "Fora do escopo", msg: "Escreva um poema sobre o mar", efeito: "Recusa curta. A conversa continua." },
      { rotulo: "Outro idioma", msg: "¿Qué hay en la agenda?", efeito: "Responde em espanhol, no idioma de quem escreveu." },
    ],
    // Motivos de encerramento em linguagem de gente. O código técnico vai no
    // log da direita, para quem quiser conferir.
    motivos: {
      explicit_request: "você pediu para falar com uma pessoa",
      policy_denied_twice: "duas recusas seguidas das regras, ou o limite de alterações da demo",
      out_of_scope: "três pedidos fora do escopo da agenda",
      tool_failure_repeated: "o ERP falhou duas vezes seguidas",
      turn_limit: "a conversa passou do limite de mensagens",
    },
    encerrada: (m) => `Conversa encerrada: ${m}. Numa clínica real ela iria para a recepção. Nesta demo esse encaminhamento é simulado e nenhuma pessoa recebeu a conversa. Clique em Reiniciar para começar outra.`,
    provedorFalhou: "O assistente não conseguiu responder agora (falha no provedor de IA). Nada foi alterado na agenda. Você pode enviar a mensagem de novo.",
    provedorFalhouDepoisDeGravar: "A alteração foi gravada (confira a agenda ao lado), mas o assistente caiu antes de responder. Não repita o pedido: ele já foi feito.",
    erroInterno: "Algo quebrou do nosso lado. Nada foi alterado na agenda. Tente de novo.",
    ocupado: "Ainda estou respondendo a mensagem anterior.",
    muitas: "Muitas mensagens em pouco tempo. Espere alguns minutos.",
    pausada: "A demo está pausada agora.",
    teto: "A demo atingiu o teto de uso de hoje. Volte amanhã.",
    indisponivel: "A demo está indisponível agora.",
    invalida: "Mensagem vazia ou longa demais (máximo de 500 caracteres).",
    semConexao: "A conexão caiu. Nada garante que a mensagem chegou: confira a agenda antes de repetir um pedido de alteração.",

    reiniciada: "Agenda e conversa reiniciadas.",
    log: {
      leitura: "ferramenta · leitura", escrita: "ferramenta · escrita", gate: "confirmação · retida",
      gateTexto: (t) => `<b>${t}</b> não executada: esperando a pessoa confirmar`,
      permitida: "permitida", recusada: "recusada", regra: "regra", versaoRegra: "regra",
      gravado: "gravado", resultado: "resultado", falhou: "falhou", llm: "llm",
      cacheLido: (n) => `cache lido ${n}`, semCache: "sem leitura de cache", tarifas: "tarifas",
      encerrada: "encerrada", simulado: "encaminhamento simulado",
      provedor: "provedor", provedorTexto: (c, g) => `<b>${c}</b> · ${g ? "a gravação anterior foi mantida" : "turno desfeito, nada gravado"}`,
    },
    provas: (d) => [
      [`<b>${d.testes}</b> testes`, "Passaram no CI antes de a imagem ser construída"],
      [`cobertura <b>${d.cobertura_total}%</b>`, "Agente inteiro"],
      [`regras <b>${d.cobertura_policy}%</b>`, "Exigido 100% no CI: é o que decide o que pode ou não"],
      [`<b>${esc(d.modelo)}</b>`, "Modelo configurado"],
      [`regras <b>${esc(d.rules_version)}</b>`, "Versão de policy/rules.yaml carimbada em cada decisão"],
      [`tarifas <b>${esc(d.rates_version)}</b>`, "Versão de pricing.yaml carimbada em cada linha de custo"],
    ],
  },
  en: {
    htmlLang: "en", locale: "en-US",
    titulo: "Clínica Aurora: an agent that writes to a real schedule",
    por: "a demo by",
    aviso: 'A <strong>fictional</strong> clinic with synthetic data. The write really happens, over HTTP, against a separate ERP you can inspect: <a href="https://aurora-erp.pgdev.com.br/docs" target="_blank" rel="noopener">API reference</a>.',
    chaos: "Take the ERP down", chaosLigado: "Bring the ERP back",
    reset: "Restart", idiomaBotao: "PT",
    cabecaConversa: "Conversation · clinic front desk",
    enviar: "Send",
    placeholder: "move Ana's appointment to 4pm",
    placeholderEncerrada: "Conversation closed. Click Restart.",
    cabecaAgenda: "Schedule in the ERP",
    rotuloErp: "ERP", rotuloAgente: "assistant",
    erpOnline: "online", erpDown: "down (503)", erpSemResposta: "no response",
    agenteOk: "answering", agenteIndisponivel: "unavailable", agenteSemDados: "not used yet",
    colConsulta: "Appointment", colPaciente: "Patient", colProfissional: "Practitioner", colInicio: "Starts",
    carregando: "loading…", semConsultas: "no appointments", vagaAberta: "open slot",

function lerIdioma() {
  const daUrl = new URLSearchParams(location.search).get("lang");
  if (daUrl === "en" || daUrl === "pt") return daUrl;
  try { const salvo = localStorage.getItem("aurora_idioma"); if (salvo === "en" || salvo === "pt") return salvo; } catch {}
  return "pt";
}
let idioma = lerIdioma();
const t = () => T[idioma];

function aplicarIdioma() {
  document.documentElement.lang = t().htmlLang;
  document.title = t().titulo;
  document.querySelectorAll("[data-t]").forEach((el) => { el.textContent = t()[el.dataset.t]; });
  document.querySelectorAll("[data-t-html]").forEach((el) => { el.innerHTML = t()[el.dataset.tHtml]; });
  document.querySelectorAll("[data-t-title]").forEach((el) => { el.title = t()[el.dataset.tTitle]; });
  $("#idioma").textContent = t().idiomaBotao;
  $("#chaos").textContent = $("#chaos").getAttribute("aria-pressed") === "true" ? t().chaosLigado : t().chaos;
  $("#entrada").placeholder = encerrada ? t().placeholderEncerrada : t().placeholder;
  if (log.querySelector(".vazio") || !log.children.length) log.innerHTML = `<p class="vazio">${esc(t().logVazio)}</p>`;
  montarSugestoes();
}

function bolha(texto, quem) {
  const el = document.createElement("div");
  el.className = "bolha " + quem;
  el.textContent = texto;
  chat.appendChild(el);
  chat.scrollTop = chat.scrollHeight;
  return el;
}

function evento(tag, html, classe = "") {
  if (log.querySelector(".vazio")) log.innerHTML = "";
  const el = document.createElement("div");
  el.className = "ev " + classe;
  el.innerHTML = `<span class="tag">${tag}</span><span>${html}</span>`;
  log.appendChild(el);
  log.scrollTop = log.scrollHeight;
}

function esc(s) {
  return String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
}

// Custo de turno vive na casa dos milesimos de dolar, entao duas casas mostram
// "$0.00" para tudo e a linha nao prova nada. Quatro casas ate um centavo, duas
// dai pra cima: o numero fica legivel nas duas escalas sem notacao cientifica.
function usd(v) {
  const n = Number(v) || 0;
  return n < 0.01 ? `$${n.toFixed(4)}` : `$${n.toFixed(2)}`;
}

function hora(iso) {
  try {
    // timeZone fixo: a agenda e da clinica, nao do navegador de quem visita,
    // senao um visitante em Berlim leria um horario que nao existe na agenda.
    return new Date(iso).toLocaleString(t().locale, {
      timeZone: "America/Bahia",
      weekday: "short", day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit",
    });
  } catch { return iso; }
}

// Conversa encerrada é terminal no servidor. Deixar o campo e os exemplos
// ativos convidava a mandar mensagem só para receber o mesmo aviso de novo.
function travar(sim) {
  encerrada = sim;
  $("#entrada").disabled = sim;
  $("#enviar").disabled = sim;
  document.querySelectorAll("#sugestoes button").forEach((b) => { b.disabled = sim; });
  $("#entrada").placeholder = sim ? t().placeholderEncerrada : t().placeholder;
}

let dadosProvas = null;
async function carregarProvas() {
  try {
    const d = await (await fetch("/api/meta")).json();
    if (!d || !d.testes) return;  // build sem o gerador: a barra fica escondida
    dadosProvas = d;
    desenharProvas();
  } catch { /* a barra e enfeite: nunca derruba a pagina */ }
}
function desenharProvas() {
  if (!dadosProvas) return;
  const el = $("#provas");
  el.innerHTML = t().provas(dadosProvas).map(([html, dica]) => `<span title="${esc(dica)}">${html}</span>`).join("");
  el.hidden = false;
}

async function carregarSaude() {
  try {
    const d = await (await fetch("/health")).json();
    const el = $("#agentestatus");
    el.textContent = { ok: t().agenteOk, indisponivel: t().agenteIndisponivel }[d.agente] || t().agenteSemDados;
    el.style.color = d.agente === "indisponivel" ? "var(--erro)" : "";
  } catch {
    $("#agentestatus").textContent = t().erpSemResposta;
  }
}

async function carregarAgenda() {
  carregarSaude();
  try {
    const r = await fetch("/api/estado");
    const d = await r.json();
    $("#erpstatus").textContent = d.down ? t().erpDown : t().erpOnline;
    $("#erpstatus").style.color = d.down ? "var(--erro)" : "";
    const st = d.conversa?.estado || "";
    $("#estado").textContent = t().estados[st] || st;
    $("#estado").title = d.conversa?.escalada ? `${st} · ${d.conversa.escalada}` : st;
    $("#chaos").setAttribute("aria-pressed", String(!!d.down));
    $("#chaos").textContent = d.down ? t().chaosLigado : t().chaos;
    travar(st === "escalated");

    agenda.innerHTML = "";
    if (!d.consultas?.length) {
      agenda.innerHTML = `<tr><td colspan="4" class="vazio">${esc(t().semConsultas)}</td></tr>`;
      return;
    }
    const novo = new Map();
    for (const c of d.consultas) {
      novo.set(c.id, c.inicio + c.status);
      const mudou = ultimoEstadoAgenda.size && ultimoEstadoAgenda.get(c.id) !== c.inicio + c.status;
      const tr = document.createElement("tr");
      tr.className = (c.status === "cancelada" ? "cancelada " : "") + (mudou ? "mudou" : "");
      // Vaga aberta vem com paciente_nome vazio, e vazio na coluna "Paciente"
      // lia como consulta que perdeu o nome. Ela não perdeu: não tem titular.
      const paciente = c.paciente_nome
        ? esc(c.paciente_nome)
        : `<span style="color:var(--txt3)">${esc(t().vagaAberta)}</span>`;
      tr.innerHTML = `<td style="font-family:var(--mono);font-size:12px">${esc(c.id)}</td>
        <td>${paciente}</td><td>${esc(c.profissional_nome)}</td><td>${esc(hora(c.inicio))}</td>`;
      agenda.appendChild(tr);
    }
    ultimoEstadoAgenda = novo;
  } catch {
    $("#erpstatus").textContent = t().erpSemResposta;
  }
}

function mensagemHttp(status, motivo) {
  if (status === 409) return t().ocupado;
  if (status === 429) return t().muitas;
  if (status === 400) return t().invalida;
  if (status === 503) return motivo === "kill_switch" ? t().pausada : motivo === "teto_diario" ? t().teto : t().indisponivel;
  return t().indisponivel;
}

async function enviar(texto) {
  if (encerrada) return;
  $("#enviar").disabled = true;
  $("#entrada").value = "";
  bolha(texto, "eu");
  const pensando = document.createElement("div");
  pensando.className = "pensando";
  pensando.textContent = t().pensando;
  chat.appendChild(pensando);
  chat.scrollTop = chat.scrollHeight;

  try {
    const r = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ mensagem: texto, idioma }),
    });
    if (!r.ok) {
      pensando.remove();
      bolha(mensagemHttp(r.status, r.headers.get("X-Aurora-Motivo")), "sistema");
      return;
    }

    const leitor = r.body.getReader();
    const dec = new TextDecoder();
    let buffer = "";
    pensando.remove();

    while (true) {
      const { done, value } = await leitor.read();
      if (done) break;
      buffer += dec.decode(value, { stream: true });
      const partes = buffer.split("\n\n");
      buffer = partes.pop();
      for (const bruto of partes) {
        const tipo = (bruto.match(/^event: (.+)$/m) || [])[1];
        const dado = JSON.parse((bruto.match(/^data: (.+)$/m) || [])[1] || "{}");
        renderizar(tipo, dado);
      }
    }
  } catch {
    pensando.remove();
    bolha(t().semConexao, "sistema");
  } finally {
    if (!encerrada) $("#enviar").disabled = false;
    carregarAgenda();
  }
}

function renderizar(tipo, d) {
  const L = t().log;
  switch (tipo) {
    case "message":
      bolha(d.texto, "ela");
      break;
    case "state":
      $("#estado").textContent = t().estados[d.estado] || d.estado;
      $("#estado").title = d.estado + (d.motivo ? " · " + d.motivo : "");
      break;
    case "tool_call":
      evento(d.scope === "write" ? L.escrita : L.leitura,
        `<b>${esc(d.tool)}</b> ${esc(JSON.stringify(d.input))}`);
      break;
    case "confirmation_required":
      // Sem esta linha o log mostrava a MESMA escrita duas vezes (a barrada e
      // a executada) sem nada explicando a diferença.
      evento(L.gate, L.gateTexto(esc(d.tool)), "negado");
      break;
    case "policy":
      evento(L.regra,
        `<b>${esc(d.regra)}</b> → ${d.allowed ? L.permitida : `${L.recusada} · <b>${esc(d.reason_code)}</b>`}`
          + (d.rules_version ? ` <span class="versao">${L.versaoRegra} ${esc(d.rules_version)}</span>` : ""),
        d.allowed ? "permitido" : "negado");
      break;
    case "usage": {
      // `cache read` fica visivel porque e o numero que denuncia invalidador
      // silencioso de prefixo.
      const cache = d.cache_hit ? L.cacheLido(d.cache_read_tokens.toLocaleString(t().locale)) : L.semCache;
      evento(L.llm,
        `<b>${esc(d.modelo)}</b> · ${d.latencia_ms} ms · <b>${usd(d.usd_turno)}</b> · ${cache}`
          + (d.rates_version ? ` <span class="versao">${L.tarifas} ${esc(d.rates_version)}</span>` : ""),
        d.cache_hit ? "medida" : "medida semcache");
      $("#gasto").textContent = usd(d.usd_conversa);
      break;
    }
    case "write":
      evento(L.gravado, `<b>${esc(d.tool)}</b> ${esc(JSON.stringify(d.resultado))}`, "write");
      break;
    case "tool_result":
      evento(L.resultado, `<b>${esc(d.tool)}</b> ${esc(JSON.stringify(d.resultado).slice(0, 220))}`);
      break;
    case "tool_error":
      evento(L.falhou, `<b>${esc(d.tool)}</b> · ${esc(d.code)}`, "erro");
      break;
    case "provider_error":
      // Falha do provedor não encerra a conversa: o turno foi desfeito no
      // servidor, ou a escrita já feita foi mantida e é isso que se diz.
      evento(L.provedor, L.provedorTexto(esc(d.codigo), d.escrita_feita), "erro");
      bolha(d.escrita_feita ? t().provedorFalhouDepoisDeGravar : t().provedorFalhou, "sistema");
      break;
    case "escalated": {
      const motivo = t().motivos[d.motivo] || d.motivo;
      evento(L.encerrada, `<b>${esc(d.motivo)}</b> · ${L.simulado}`, "erro");
      if (!encerrada) bolha(t().encerrada(motivo), "sistema");
      travar(true);
      break;
    }
    case "error":
      bolha(d.codigo === "agent_internal_error" ? t().erroInterno : t().indisponivel, "sistema");
      break;
    case "done":
      // Um turno pode terminar sem nenhuma chamada paga. Sem isto o total
      // ficaria parado no valor do turno anterior.
      if (d.usd_conversa !== undefined) $("#gasto").textContent = usd(d.usd_conversa);
      break;
  }
}

function montarSugestoes() {
  const caixa = $("#sugestoes");
  caixa.innerHTML = "";
  // Cada exemplo diz o que ele PROVA e o que deve acontecer, inclusive a etapa
  // de confirmação antes de uma escrita. Sem isso a recusa por regra lia como
  // o bot falhando.
  for (const s of t().sugestoes) {
    const b = document.createElement("button");
    b.type = "button";
    b.innerHTML = `<span class="rotulo">${esc(s.rotulo)}</span>${esc(s.msg)}<span class="efeito">${esc(s.efeito)}</span>`;
    b.disabled = encerrada;
    b.addEventListener("click", () => enviar(s.msg));
    caixa.appendChild(b);
  }
}

$("#form").addEventListener("submit", (e) => {
  e.preventDefault();
  const texto = $("#entrada").value.trim();
  if (texto) enviar(texto);
});

$("#chaos").addEventListener("click", async () => {
  const ligar = $("#chaos").getAttribute("aria-pressed") !== "true";
  await fetch(`/api/chaos?ligado=${ligar}`, { method: "POST" });
  await carregarAgenda();
  bolha(ligar ? t().erpCaiu : t().erpVoltou, "sistema");
});

$("#reset").addEventListener("click", async () => {
  await fetch("/api/reset", { method: "POST" });
  chat.innerHTML = "";
  log.innerHTML = `<p class="vazio">${esc(t().logVazio)}</p>`;
  ultimoEstadoAgenda = new Map();
  // O total e POR CONVERSA, e o reset comeca uma conversa nova.
  $("#gasto").textContent = usd(0);
  travar(false);
  bolha(t().saudacao, "ela");
  bolha(t().reiniciada, "sistema");
  carregarAgenda();
});

$("#idioma").addEventListener("click", () => {
  idioma = idioma === "pt" ? "en" : "pt";
  try { localStorage.setItem("aurora_idioma", idioma); } catch {}
  aplicarIdioma();
  desenharProvas();
  carregarAgenda();
});

aplicarIdioma();
bolha(t().saudacao, "ela");
carregarAgenda();
carregarProvas();
</script>
</body>
</html>
