[pytest]
testpaths = tests
# `..` põe o ERP no path. Ele é um serviço separado e continua sem suíte
# própria, mas a semeadura da agenda é regra de negócio o bastante para ter
# teste: era ela que nascia fora do expediente e derrubava a demo.
pythonpath = . ..
asyncio_mode = auto
addopts = -q
# Conversa com o modelo de verdade: paga. Fica pulada sem ANTHROPIC_API_KEY e
# AURORA_EVAL=1 (ver tests/test_avaliacao_idioma.py).
markers =
    modelo_real: conversa com o modelo real, paga; roda só com ANTHROPIC_API_KEY e AURORA_EVAL=1
