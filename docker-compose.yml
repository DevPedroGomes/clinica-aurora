# A demo do arquétipo B: dois serviços separados de propósito.
#
# O ERP é publicado junto com o agente, com OpenAPI aberto, para que o visitante
# possa inspecionar o outro lado da integração — e para que a escrita aconteça
# sobre HTTP de verdade, contra um processo diferente, e não numa tabela do
# mesmo banco. É isso que torna o botão "derrubar o sistema" honesto.
services:
  erp:
    image: ghcr.io/devpedrogomes/clinica-aurora/erp:latest
    build:
      context: ./erp
    container_name: aurora-erp
    restart: unless-stopped
    environment:
      ERP_CORS_ORIGINS: "https://aurora.pgdev.com.br"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=4).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
        reservations:
          memory: 64M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.aurora-erp.entrypoints=https"
      - "traefik.http.routers.aurora-erp.rule=Host(`aurora-erp.pgdev.com.br`)"
      - "traefik.http.routers.aurora-erp.tls=true"
      - "traefik.http.routers.aurora-erp.tls.certresolver=letsencrypt"
      - "traefik.http.routers.aurora-erp.middlewares=aurora-erp-security@docker"
      - "traefik.http.services.aurora-erp.loadbalancer.server.port=8080"
      - "traefik.http.middlewares.aurora-erp-security.headers.stsSeconds=31536000"
      - "traefik.http.middlewares.aurora-erp-security.headers.stsIncludeSubdomains=true"
      - "traefik.http.middlewares.aurora-erp-security.headers.stsPreload=true"
      - "traefik.http.middlewares.aurora-erp-security.headers.forceSTSHeader=true"
      - "traefik.http.middlewares.aurora-erp-security.headers.contentTypeNosniff=true"
      - "traefik.http.middlewares.aurora-erp-security.headers.browserXssFilter=true"
      - "traefik.http.middlewares.aurora-erp-security.headers.referrerPolicy=strict-origin-when-cross-origin"
      - "traefik.http.middlewares.aurora-erp-security.headers.frameDeny=true"

  agente:
    image: ghcr.io/devpedrogomes/clinica-aurora/agente:latest
    build:
      context: ./agent
    container_name: aurora-agente
    restart: unless-stopped
    depends_on:
      - erp
    env_file: .env
    environment:
      ERP_URL: "http://erp:8080"
      BUDGET_PATH: "/data/budget.json"
    volumes:
      - aurora_budget:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=4).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
        reservations:
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.aurora.entrypoints=https"
      - "traefik.http.routers.aurora.rule=Host(`aurora.pgdev.com.br`)"
      - "traefik.http.routers.aurora.tls=true"
      - "traefik.http.routers.aurora.tls.certresolver=letsencrypt"
      - "traefik.http.routers.aurora.middlewares=aurora-security@docker"
      - "traefik.http.services.aurora.loadbalancer.server.port=8080"
      - "traefik.http.middlewares.aurora-security.headers.stsSeconds=31536000"
      - "traefik.http.middlewares.aurora-security.headers.stsIncludeSubdomains=true"
      - "traefik.http.middlewares.aurora-security.headers.stsPreload=true"
      - "traefik.http.middlewares.aurora-security.headers.forceSTSHeader=true"
      - "traefik.http.middlewares.aurora-security.headers.contentTypeNosniff=true"
      - "traefik.http.middlewares.aurora-security.headers.browserXssFilter=true"
      - "traefik.http.middlewares.aurora-security.headers.referrerPolicy=strict-origin-when-cross-origin"
      - "traefik.http.middlewares.aurora-security.headers.frameDeny=true"

volumes:
  aurora_budget:

networks:
  proxy:
    external: true
