# A demo do arquétipo B: dois serviços separados de propósito.
#
# O ERP é publicado junto com o agente, com OpenAPI aberto, para que o visitante
# possa inspecionar o outro lado da integração — e para que a escrita aconteça
# sobre HTTP de verdade, contra um processo diferente, e não numa tabela do
# mesmo banco. É isso que torna o botão "derrubar o sistema" honesto.
services:
  erp:
    image: ghcr.io/devpedrogomes/clinica-aurora/erp:latest
    build:
      context: ./erp
    container_name: aurora-erp
    restart: unless-stopped
    environment:
      ERP_CORS_ORIGINS: "https://aurora.pgdev.com.br"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=4).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
        reservations:
          memory: 64M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.aurora-erp.entrypoints=https"
      - "traefik.http.routers.aurora-erp.rule=Host(`aurora-erp.pgdev.com.br`)"
      - "traefik.http.routers.aurora-erp.tls=true"
      - "traefik.http.routers.aurora-erp.tls.certresolver=letsencrypt"
      - "traefik.http.routers.aurora-erp.middlewares=aurora-erp-security@docker"
      - "traefik.http.services.aurora-erp.loadbalancer.server.port=8080"
      - "traefik.http.middlewares.aurora-erp-security.headers.stsSeconds=31536000"
      - "traefik.http.middlewares.aurora-erp-security.headers.stsIncludeSubdomains=true"
      - "traefik.http.middlewares.aurora-erp-security.headers.stsPreload=true"
      - "traefik.http.middlewares.aurora-erp-security.headers.forceSTSHeader=true"
      - "traefik.http.middlewares.aurora-erp-security.headers.contentTypeNosniff=true"
      - "traefik.http.middlewares.aurora-erp-security.headers.browserXssFilter=true"
      - "traefik.http.middlewares.aurora-erp-security.headers.referrerPolicy=strict-origin-when-cross-origin"
      - "traefik.http.middlewares.aurora-erp-security.headers.frameDeny=true"

  agente:
    image: ghcr.io/devpedrogomes/clinica-aurora/agente:latest
    build:
      context: ./agent
    container_name: aurora-agente
    restart: unless-stopped
    depends_on:
      - erp
    env_file: .env
    environment:
      ERP_URL: "http://erp:8080"
      BUDGET_PATH: "/data/budget.json"
    volumes:
      - aurora_budget:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=4).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
        reservations:
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.aurora.entrypoints=https"
      - "traefik.http.routers.aurora.rule=Host(`aurora.pgdev.com.br`)"
      - "traefik.http.routers.aurora.tls=true"
      - "traefik.http.routers.aurora.tls.certresolver=letsencrypt"
      - "traefik.http.routers.aurora.middlewares=aurora-security@docker"
      - "traefik.http.services.aurora.loadbalancer.server.port=8080"
      - "traefik.http.middlewares.aurora-security.headers.stsSeconds=31536000"
      - "traefik.http.middlewares.aurora-security.headers.stsIncludeSubdomains=true"
      - "traefik.http.middlewares.aurora-security.headers.stsPreload=true"
      - "traefik.http.middlewares.aurora-security.headers.forceSTSHeader=true"
      - "traefik.http.middlewares.aurora-security.headers.contentTypeNosniff=true"
      - "traefik.http.middlewares.aurora-security.headers.browserXssFilter=true"
      - "traefik.http.middlewares.aurora-security.headers.referrerPolicy=strict-origin-when-cross-origin"
      - "traefik.http.middlewares.aurora-security.headers.frameDeny=true"

  # Servidor MCP: o mesmo motor de politica, exposto pro agente do visitante.
  #
  # Servico separado, e nao uma rota no `agente`, por dependencia: o SDK do MCP
  # arrasta `sse-starlette`, que exige `starlette>=0.49`, e o agente roda
  # `fastapi==0.115.6`, que exige `starlette<0.42`. Os dois nao cabem no mesmo
  # interpretador. Separar tambem impede que uma sessao MCP mal comportada
  # derrube a demo web.
  #
  # Sem DNS novo de proposito: o Traefik roteia por PATH no dominio que ja
  # existe. A regra `Host && PathPrefix` e mais longa que a do `agente`, entao
  # ganha por prioridade — mas a prioridade vai explicita abaixo, porque
  # depender do comprimento da regra e o tipo de coisa que quebra quando alguem
  # renomeia um host.
  mcp:
    image: ghcr.io/devpedrogomes/clinica-aurora/mcp:latest
    build:
      context: .
      dockerfile: mcpsrv/Dockerfile
    container_name: aurora-mcp
    restart: unless-stopped
    depends_on:
      - erp
    environment:
      ERP_URL: "http://erp:8080"
      # O healthcheck bate em 127.0.0.1:8080, entao ele tambem precisa estar na
      # allowlist de Host, senao o container se declara doente sozinho. O sufixo
      # `:*` NAO e decoracao: a comparacao do SDK e exata, e `127.0.0.1` sozinho
      # nao casa com `127.0.0.1:8080`. O host publico vai sem porta porque o
      # Traefik encaminha assim no 443.
      MCP_ALLOWED_HOSTS: "aurora.pgdev.com.br,127.0.0.1:*,localhost:*"
    healthcheck:
      test: ["CMD", "python", "/app/mcpsrv/healthcheck.py"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 384M
          cpus: '0.5'
        reservations:
          memory: 96M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.aurora-mcp.entrypoints=https"
      - "traefik.http.routers.aurora-mcp.rule=Host(`aurora.pgdev.com.br`) && PathPrefix(`/mcp`)"
      - "traefik.http.routers.aurora-mcp.priority=100"
      - "traefik.http.routers.aurora-mcp.tls=true"
      - "traefik.http.routers.aurora-mcp.tls.certresolver=letsencrypt"
      - "traefik.http.routers.aurora-mcp.middlewares=aurora-mcp-security@docker"
      - "traefik.http.services.aurora-mcp.loadbalancer.server.port=8080"
      - "traefik.http.middlewares.aurora-mcp-security.headers.stsSeconds=31536000"
      - "traefik.http.middlewares.aurora-mcp-security.headers.stsIncludeSubdomains=true"
      - "traefik.http.middlewares.aurora-mcp-security.headers.stsPreload=true"
      - "traefik.http.middlewares.aurora-mcp-security.headers.forceSTSHeader=true"
      - "traefik.http.middlewares.aurora-mcp-security.headers.contentTypeNosniff=true"
      - "traefik.http.middlewares.aurora-mcp-security.headers.browserXssFilter=true"
      - "traefik.http.middlewares.aurora-mcp-security.headers.referrerPolicy=strict-origin-when-cross-origin"
      - "traefik.http.middlewares.aurora-mcp-security.headers.frameDeny=true"

volumes:
  aurora_budget:

networks:
  proxy:
    external: true
